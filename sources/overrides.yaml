  # ══ Tavily 搜索：用户提供密钥后启用 ══════════════════════════════════════════════
  #
  # 此前适配器缺失：registry 生成器给所有 source_type=api 的源派 ApiFetcher，
  # 而 Tavily 是**搜索 API**（query 与结果数在 POST body 里），没有可供 GET 的 URL。
  # 通用 JSON 解析器对它发 GET，得到的自然是 401/405。
  # 新增 TavilyFetcher（POST + 显式 skip 而非静默 0 条）。
  #
  # 密钥经 TAVILY_API_KEY 环境变量注入（GitHub Secret），**不写入本仓库**。
  "api:api-tavily-com-search":
    enabled: true
    adapter: TavilyFetcher
    category: search
    reason: >-
      2026-10-16 用户提供密钥后启用。TavilyFetcher 走 POST，密钥只放在
      Authorization 头（不放 URL，避免密钥进日志）。返回的是搜索结果而非已发布条目，
      因此 published_date 缺失时留空，由流水线按「未知新鲜度」处理，
      而不是盖上抓取时间冒充当天发布。

  # ── 同一 feed 的两个登记：归到同一 dedup_group ────────────────────────────
  #
  # 2026-10-19 核对 registry 发现 5 组 URL 完全相同的启用源：同一个 feed 被审计仓库
  # (Horizon) 和用户清单各登记了一次，source_id 不同、URL 相同。
  # 流水线会抓两遍，同一条新闻被算成两个独立来源 —— 而 independent_source_count
  # 是热度排序里最重的信号，也是「多源验证」徽标的依据。它不能是流水线自己
  # 制造出来的数字。
  #
  # 处理方式：不删除（删除会丢溯源），改用 dedup_group 把它们标记为同一发布者。
  # 归组之后，同一条新闻只计一次独立来源，两个 id 仍各自保留抓取记录。
  "rss:wechat2rss-xlab-app-51e92aad2728acdd1fda7314be32b16639353001":
    dedup_group: "jiqizhixin"
    reason: >-
      与 rss:wechat-jiqizhixin-xlab 是同一个 feed（URL 完全相同），只是登记来源不同。
      归入同一 dedup_group，避免机器之心的同一篇文章被算成两个独立来源。

