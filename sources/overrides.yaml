    category: search
    enabled: true
    reason: 2026-10-16 用户提供密钥后启用。TavilyFetcher 走 POST，密钥只放在 Authorization 头（不放 URL，避免密钥进日志）。返回的是搜索结果而非已发布条目， 因此 published_date 缺失时留空，由流水线按「未知新鲜度」处理， 而不是盖上抓取时间冒充当天发布。
