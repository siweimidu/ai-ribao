  # ── AIHOT：两个 feed 是同一批内容的两种切分，必须归为一组 ──────────────────
  # 审计源收录的是 /feed/all.xml（最近 7 天全站动态，来自 Horizon 的源清单）；
  # 增补源补上 /feed.xml（编辑精选）。精选是全站动态的子集。
  # 不归组的话，同一条新闻会以两个"独立来源"的身份进入 L3 聚类，
  # 直接虚高「独立来源数」—— 那是本站排序与多源验证最核心的信号。
  "rss:aihot-news":
    dedup_group: "aihot"
    reason: "与增补源 rss:aihot-news-picks 是同一批内容（全站动态 vs 编辑精选），归为一组避免重复计入独立来源数"

  # ══ 全部启用：实测可用，并指到真正能读它的适配器 ═══════════════════════════════
  #
  # 这 2 个源此前被标成 map 到 JsonApiFetcher —— 而它们是 HTML 页面，JSON 解析器读不了，
  # 于是「HTTP 200 但 0 条」：看起来采集成功，实际什么也没拿到。
  # 现在 HtmlFetcher 已实现，它们指向正确的适配器。
  #
  # 实测（2026-10-14，curl -L --compressed）：
  #   aibase.com      200 / 197KB HTML / HtmlFetcher 提取 40 条真实文章
  #   xinzhiyuan.ai   200 / 1KB HTML（页面很薄，可能是 JS 渲染；启用后由采集结果说明）
  "api:aibase-com":
    enabled: true
    adapter: HtmlFetcher
    reason: >-
      2026-10-14 实测 200，HtmlFetcher 提取 40 条文章（含标题与日期）。
      此前被映射到 JsonApiFetcher 而读不出内容 —— 是适配器缺失，不是源的问题。
  "api:xinzhiyuan-ai":
    enabled: true
    adapter: HtmlFetcher
    reason: >-
      2026-10-14 实测 200。页面仅 1KB，可能是 JS 渲染；启用后以实际采集条数为准，
      若长期为 0 再按证据禁用。

