  # ── 需要专用采集器（当前未实现，明确跳过而不是静默零条）─────────────────────
  "api:hacker-news-firebaseio-com-v0-topstories":
    adapter: HackerNewsFirebaseFetcher
    reason: >-
      Firebase 端点只返回 ID 列表，需要 N 次额外请求才能取回内容。
      HN 覆盖已由 api:hn-algolia-com-search 提供（单次请求返回完整字段），
      待需要更完整的 HN 数据时再实现。
  "api:trends-google-com-trends-explore":
    adapter: PyTrendsFetcher
    reason: "该 URL 是公开网页，pytrends 走的是内部接口；需专用采集器"

  # ── 来源独立性：把承载同一内容的 feed 归为一组 ─────────────────────────────
  # hn-algolia 与 hnrss-frontpage 呈现的是同一批 HN 首页内容（L2 实测：当日 6 组合并
  # 全部来自这一对）。如果把它们算作"两个来源"，一条只有单一来源的新闻就会被标成
  # "多源交叉验证"——那是虚假的可信度。归组后 independent_source_count 才说真话。
  "api:hn-algolia-com-search":
    dedup_group: hackernews
    reason: "与 rss:hnrss-org-frontpage 承载同一批 HN 内容，不得计为两个独立来源"
  "rss:hnrss-org-frontpage":
    dedup_group: hackernews
    reason: "与 api:hn-algolia-com-search 承载同一批 HN 内容，不得计为两个独立来源"

  # ── 优先级修正（按读者价值，而非按发现顺序）────────────────────────────────
  "rss:daily-juya-uk":
    priority: 1
    reason: "被 3 个仓库同时收录的最重要中文源，且是关键源（run.critical_sources）"
  "rss:openai-com-news":
    priority: 1
    reason: "厂商一手官方公告，权威性最高"
  "rss:deepmind-google-blog":
    priority: 1
    reason: "厂商一手官方公告"
  "rss:raw-githubusercontent-com-ai-rss-feeds-anthropic-news":
    priority: 1
    reason: "厂商一手官方公告"

  # ── AIHOT：两个 feed 是同一批内容的两种切分，必须归为一组 ──────────────────
  # 审计源收录的是 /feed/all.xml（最近 7 天全站动态，来自 Horizon 的源清单）；
  # 增补源补上 /feed.xml（编辑精选）。精选是全站动态的子集。
  # 不归组的话，同一条新闻会以两个"独立来源"的身份进入 L3 聚类，
  # 直接虚高「独立来源数」—— 那是本站排序与多源验证最核心的信号。
  "rss:aihot-news":
    dedup_group: "aihot"
    reason: "与增补源 rss:aihot-news-picks 是同一批内容（全站动态 vs 编辑精选），归为一组避免重复计入独立来源数"