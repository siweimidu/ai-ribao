  # ── 来源独立性：把承载同一内容的 feed 归为一组 ─────────────────────────────
  # hn-algolia 与 hnrss-frontpage 呈现的是同一批 HN 首页内容（L2 实测：当日 6 组合并
  # 全部来自这一对）。如果把它们算作"两个来源"，一条只有单一来源的新闻就会被标成
  # "多源交叉验证"——那是虚假的可信度。归组后 independent_source_count 才说真话。
  "api:hn-algolia-com-search":
    dedup_group: hackernews
    reason: "与 rss:hnrss-org-frontpage 承载同一批 HN 内容，不得计为两个独立来源"
  "rss:hnrss-org-frontpage":
