# 人工修正层
#
# 用途：在不改动 sources/registry.yaml 的前提下，覆盖 enabled / priority /
# polling_interval / category / timeout_s / fetch_method / adapter / notes。
#
# 三条硬规则（由 src/aidaily/registry.py 强制，违反会直接报错）：
#   1. 只能覆盖上面列出的字段。`source_id` / `url` / `found_in` 是**证据**，不可编辑
#      —— 改写 `url` 等于把源悄悄指向了别的内容，改写 `found_in` 等于伪造溯源。
#   2. 引用不存在的 source_id 会报错，而不是静默忽略。否则"我明明禁用了那个噪音源"
#      会变成一句空话。
#   3. 禁用任何源**必须写 reason**。下一个人要能分清这是深思熟虑还是手滑。
#
# 禁用 ≠ 删除：被禁用的源始终留在 registry.yaml 里，随时可以重新启用。

overrides:

  # ── 探测确认失效，且有在册替代品 ──────────────────────────────────────────
  "api:git-trending-justlikemaki-vip-topone":
    enabled: false
    reason: >-
      2026-10-13 探测返回 TLS 握手失败（SSL: UNEXPECTED_EOF_WHILE_READING），
      且该服务为个人维护的第三方中转。替代方案已在册：
      scrape:github-com-trending（直连 github.com/trending）。保留配置待其恢复。

  # ── 适配器指派：把源接到真正实现了的采集器上 ──────────────────────────────
  # registry 是按 source_type 批量指派适配器的（scrape -> HtmlFetcher）。对于有专用
  # 实现的源，必须在这里指名，否则会被当成"适配器未实现"而跳过。
  "scrape:github-com-trending":
    adapter: GitHubTrendingFetcher
    reason: "有专用实现（GitHubTrendingFetcher）；通用 HtmlFetcher 未实现"

  # ── Reddit：匿名访问已被关闭，需要 OAuth 凭证 ──────────────────────────────
  # 探测证据（2026-10-13 实测，两步）：
  #   1) reddit.com/r/*/top.json  -> 12/12 返回 403 Blocked
  #   2) old.reddit.com/r/*/     -> 返回 200，但 302 跳到 /login/?reason=lor2，
  #      内容是一个 330KB 的登录页，dom.thing 选择器命中 0 个。
  # 第 2 点曾被我自己的探测脚本误判为"健康"（只看了 HTTP 200 + 体积 > 2000 字节），
  # 现已改为检查 DOM 结构。结论：Reddit 目前**无法匿名采集**，需要官方 OAuth
  # （REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET，dailydawn 的 .env 里就留了这两个位置）。
  # 因此这 15 个源不进入本次运行，但配置完整保留，补上凭证后把 needs_credential
  # 置空即可启用。
  "api:reddit-com-programming-top":
    adapter: RedditFetcher
    needs_credential: REDDIT_CLIENT_ID
    reason: "匿名访问已关闭（JSON 403 / HTML 登录墙），需 OAuth"
  "api:reddit-com-machinelearning-top":
    adapter: RedditFetcher
    needs_credential: REDDIT_CLIENT_ID
    reason: "同上"
  "api:reddit-com-localllama-top":
    adapter: RedditFetcher
    needs_credential: REDDIT_CLIENT_ID
    reason: "同上"
  "api:reddit-com-startups-top":
    adapter: RedditFetcher
    needs_credential: REDDIT_CLIENT_ID
    reason: "同上"
  "api:reddit-com-webdev-top":
    adapter: RedditFetcher
    needs_credential: REDDIT_CLIENT_ID
    reason: "同上"
  "api:reddit-com-saas-top":
    adapter: RedditFetcher
    needs_credential: REDDIT_CLIENT_ID
    reason: "同上"
  "api:reddit-com-opensource-top":
    adapter: RedditFetcher
    needs_credential: REDDIT_CLIENT_ID
    reason: "同上"
  "api:reddit-com-devops-top":
    adapter: RedditFetcher
    needs_credential: REDDIT_CLIENT_ID
    reason: "同上"
  "api:reddit-com-rust-top":
