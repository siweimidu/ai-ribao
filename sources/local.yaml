sources:
- source_id: rss:aihot-news-picks
  name: AIHOT 编辑精选
  url: https://aihot.news/feed.xml
  category: digest
  language: zh
  source_type: rss
  fetch_method: feedparser
  adapter: RssFetcher
  enabled: true
  priority: 2
  polling_interval: 6h
  timeout_s: 20
  dedup_group: aihot
  notes: 最近 50 条编辑精选。与审计源 rss:aihot-news（全站动态）同属 dedup_group "aihot"，不会重复计入独立来源数。
  why: 人工精选过的中文 AI 资讯，与本站的多源聚合互补：同一条新闻在两边都出现时 会形成真实的多源佐证，是 L3 事件聚类需要的独立来源信号。
  found_in:
  - KKKKhazix/AIHOT:README.md#它是怎么工作的
  - KKKKhazix/AIHOT:docs/sources.md#六种信源
  repositories:
  - KKKKhazix/AIHOT
  license_note: 数据使用受 https://aihot.news/terms 约束，非 MIT；其代码为 MIT。 页面须保留署名与原文/canonical 链接。
