<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图文并茂效果预览 · AI 日报</title>
<style>
:root{--ink:#12211f;--muted:#5b6b68;--line:#e0e6e4;--bg:#fbfcfb;--accent:#0f6b5c;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:48px 22px 100px}
h1{font-size:30px;margin:0 0 8px;letter-spacing:-.4px}
.lede{color:var(--muted);font-size:15px;margin:0 0 12px}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:16px 18px;margin:0 0 34px;font-size:14.5px}
.note b{color:var(--accent)}
code{background:#eef2f1;padding:1px 6px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
ul{list-style:none;margin:0;padding:0}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 18px}
.head{display:flex;gap:14px;align-items:baseline}
.no{color:var(--accent);font-weight:700;font-size:15px;flex:none}
h3{margin:0;font-size:18px;line-height:1.45;letter-spacing:-.2px}
h3 a{color:inherit;text-decoration:none}
h3 a:hover{color:var(--accent)}
.thumb{display:block;margin:14px 0 12px;border-radius:10px;overflow:hidden;background:#eef2f1;line-height:0}
.thumb img{width:100%;height:auto;display:block;max-height:420px;object-fit:cover}
.meta{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.badge{background:#e6f0ed;color:var(--accent);padding:2px 9px;border-radius:20px;font-weight:600}
.dim{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
</style></head><body><div class="wrap">
<h1>图文并茂 · 效果预览</h1>
<p class="lede">2026-10-21 归档里的事件，实时抓取来源页面的 og:image 并压缩成 WebP。</p>
<div class="note">
<b>抓取率 5 / 6。</b>失败那条是聚合站，服务端不渲染任何图片元数据。压缩后单张 6–31 KB（原始 90–226 KB）。
此页是本地预览，图片从 <code>demo-media/</code> 读取，不是 jsDelivr 上的正式地址。
</div>

</div></body></html>
