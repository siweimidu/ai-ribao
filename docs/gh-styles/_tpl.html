<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>GitHub 仓库卡片 · 10 种风格</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1116;color:#e6edf3;font:15px/1.7 -apple-system,"Segoe UI","PingFang SC",sans-serif;padding:40px 24px 80px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:26px;font-weight:700;margin-bottom:6px;letter-spacing:-.4px}
.sub{color:#8b949e;font-size:14px;margin-bottom:36px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:#161b22;border:1px solid #21262d;border-radius:12px;overflow:hidden}
.label{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:#6e7681;padding:12px 16px;background:#0d1117;border-bottom:1px solid #21262d}
.shot{padding:16px}
.shot img{width:100%;display:block;border-radius:8px}
.note{font-size:12.5px;color:#8b949e;padding:0 16px 14px;line-height:1.6}
</style></head><body><div class="wrap">
<h1>GitHub 仓库卡片 · 10 种风格</h1>
<p class="sub">同一个仓库 vllm-project/vllm，十种排版。全部由代码生成，不是截图。</p>
<div class="grid">
<!--STYLES-->
</div>
</div></body></html>
