[project]
name = "aidaily"
version = "0.1.0"
description = "统一 AI 日报聚合平台：多源采集 → 三层去重 → LLM 分析 → 多端分发"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
fetchers = ["beautifulsoup4>=4.12", "lxml>=5.0", "trafilatura>=2.1"]
llm = ["openai>=1.54"]
# `dev` includes the parser dependencies on purpose: the offline fetcher tests exercise
# the HTML parsers, so `pip install -e ".[dev]"` alone must be enough to run the suite.
# Without this, CI installed no bs4 and the Reddit/GitHub-Trending parser tests failed
# with ModuleNotFoundError -- a broken install, not a broken test.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "beautifulsoup4>=4.12", "lxml>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidaily"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits the real network (deselect with -m 'not network')"]
