# 运行配置（非敏感，可入库）
#
# Secrets live ONLY in environment variables / GitHub Secrets -- never here, never in
# sources/registry.yaml, never in generated output. See docs/ARCHITECTURE.md §9.
#
# 生成时间：北京时间 04:00 / 12:00 / 20:00 各采集一次，结果去重合并进同一天。
# `at` 是当天第一次采集的时间，也是「早于它就不生成当天日报」这道闸门的依据。

timezone: Asia/Shanghai

run:
  at: "04:00"                  # 当天第一次采集；也是「早于它不生成当天日报」闸门的依据
  slots: ["04:00", "12:00", "20:00"]   # 每天三个采集时段，wait_window 与闸门都读这里
  window_hours: 26              # 24h + 余量，对抗定时延迟
  critical_wait_minutes: 20     # 关键源当日版缺失时最多等待
  critical_sources:             # 缺了它们就必须等待或明确标注，而不是静默带上旧内容
    - "rss:daily-juya-uk"
    - "rss:ainewslog-com"
    - "jsonfeed:dailydawn-dev"
    - "rss:hex2077-dev-rss-zh-cn"

output:
  brief:                        # → QQ 邮件 + Telegram
    enabled: true
    max_items: 15
    languages: [zh]
  deep:                         # → GitHub Pages + RSS + n8n + 归档
    enabled: true
    max_items: 60
    languages: [zh]
    english_on_demand: false    # 免费额度约束：深度版默认纯中文

dedup:
  l2:                           # 同一篇文章的重复抓取/转载
    simhash_distance: 3
    title_similarity_merge: 0.85
    title_similarity_ambiguous: 0.92
    publish_window_hours: 72
    ambiguous_window_hours: 24
  l3:                           # 多篇不同文章报道同一事件（语义）
    candidate_limit: 150        # 先用规则把当日条目压到这个规模，再动用 LLM
    max_clusters: 60            # 最多把多少个候选簇交给模型判定（每个一次调用）
    judge_concurrency: 4
    entity_overlap_min: 2
    time_bucket_hours: 6
    confidence_threshold: 0.75
    cross_day_window_days: 7    # 文件方案的语义去重窗口上限
    enabled: true

quality:
  min_content_chars: 200
  source_weights:
    lab-official: 1.5
    zh-media: 1.2
    lab-blog: 1.2
    media: 1.1
    digest: 1.1
    paper: 1.0
    community: 0.9
    preset: 0.6
    example: 0.3
    model: 1.1
    dev: 1.0
    product: 0.9
    search: 0.8
    other: 0.8
  # ── 排序（见 src/aidaily/rank.py）────────────────────────────────────────
  # 旧实现是 (-独立来源数, -时间)，当天独立来源数全为 0 时退化成纯按时间排，
  # 结果头 10 条里 7 条是同一话题的不同角度、且全部来自同一个源。
  recency_half_life_hours: 12      # 12 小时后新近度减半
  recency_floor: 0.25              # 旧条目的分数下限：不然衰减本身又会变回纯按时间排
  corroboration: 0.35              # 每多一个独立来源的加成
  content_substance: 0.45          # 有正文的加成（只有标题的条目产不出事实）
  engagement: 0.20                 # 点数/点赞，次要信号
  max_per_source: 2                # 单一源在头条最多占几条
  max_per_group: 3                 # 同一 dedup_group 最多占几条
  topic_similarity_penalty: 0.35   # 与已选标题高度相似时的分数折扣
  topic_similarity_threshold: 0.55
  topic_overlap_min: 2             # 共享几个实体算同一话题（1 个通常只是「Google」）
  topic_overlap_penalty: 0.45      # 同一话题再来一条的折扣
  duplicate_url_penalty: 0.10      # 不仅同话题、还共享 URL：那是同一篇文章（L2 漏网的），
                                   # 应重罚而不是当第二个来源
                                   # 实测：字符串相似度抓不到「Gemini 4 Argon: Built to
                                   # solve...」与「Gemini 4 Argon for Robotics」（仅 0.557，
                                   # 卡在阈值上），跨语言更是完全失效（0.31）——实体重叠
                                   # 把头条里的同话题条目从 9 条降到 1 条

delivery:
  email: true
  telegram: true
  rss: true
  n8n: true
  pages: true

storage:
  cold: r2                      # 可选冷存；R2 凭证缺失时自动降级为本地
  r2_optional: true
  content_retention_days: 30    # 正文全文只留 30 天，更早只留指纹与链接
  monthly_shard_compression: zstd

llm:
  # 三层供应商：官方免费优先 → 官方付费(默认关) → 第三方中转兜底
  tiers: [official-free, relay]
  max_calls_per_run: 400
  max_tokens_per_run: 2000000
  # Relay (third-party OpenAI-compatible) call ceiling per run.
  #
  # 20 was set when the relay was only a fallback for a handful of entries the official
  # free tiers could not cover. That number is now the binding constraint on the digest
  # being readable: a full day is ~60 events, and when the official tiers are rate limited
  # (measured: `gemini: HTTP 429 daily`, `groq: HTTP 429`) the relay is the only path that
  # produces Chinese. At 20, forty entries render the source's own English headline.
  #
  # 120 leaves headroom for the ~60 analyses plus retries while still bounding a runaway
  # loop. The per-run token budget remains the real cost guard.
  relay_max_calls_per_run: 120   # 中转站不可信，硬限制调用量
  request_timeout_s: 120
  batch_size:
    summarize: 8                # daybrief 实测：8 条一批可省数倍调用
    cluster_judge: 10
    # 每次 rubric 调用评多少条。比另外两项大，因为每条内容很短（一个 id + 一个标题），
    # 批量的意义就是把一整轮排序从约 60 次调用压到 10 次以内。
    rubric: 10
    # rubric 并发。刻意压低：它在发布之前运行，这里被限流会拖慢整轮，而不是降级某一条。
    rubric_concurrency: 2

budget:
  # 运行期熔断；超限则降级为规则摘要并在 digest.warnings 中声明
  on_exceed: degrade_to_rules
