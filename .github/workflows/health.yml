name: Source Health

# Weekly, off the critical path. Probes every source in the registry and opens an issue
# when something stopped working.
#
# Health cannot be inferred from a daily run: a feed that returns 404 every day looks
# exactly like a feed that is simply quiet, and the daily run correctly reports neither
# as a failure. Only an explicit probe separates "no news" from "broken".

on:
  schedule:
    # Sunday 03:17 Beijing = Saturday 19:17 UTC. Off the hour, and on a day nobody reads.
    - cron: "17 19 * * 6"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-daily-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Probe every source
        # Writes docs/HEALTH_REPORT.md and appends to data/state/health.jsonl. The
        # control URL inside the probe detects a local network problem and reports the
        # verdicts as unreliable rather than blaming every source.
        run: python scripts/probe_sources.py --workers 10

      - name: Verify the registry is still trustworthy
        run: pytest -q tests/contract/test_source_coverage.py

      - name: Commit the refreshed report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HEALTH_REPORT.md data/state/health.jsonl
          if git diff --staged --quiet; then
            echo "no change in source health"
            exit 0
          fi
          git commit -m "chore(health): weekly source probe"
          # Same reasoning as the digest commit step: a rebase conflict here means two runs
          # wrote the same generated report, not that a human edit needs merging. Keep this
          # run's version. `attempt` is used in the log line, so it is not an unused variable
          # (shellcheck SC2034).
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing (attempt $attempt)"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase -X theirs "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            sleep 3
          done
          echo "::error::failed to push after 3 attempts"
          exit 1

      - name: Summarise
        id: summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          rows = [json.loads(l) for l in pathlib.Path("data/state/health.jsonl").read_text(encoding="utf-8").splitlines() if l.strip()]
          latest = {}
          for r in rows:
              latest[r["source_id"]] = r          # last write wins
          counts = collections.Counter(r["verdict"] for r in latest.values())
          print("### Source health\n")
          print("| verdict | count |")
          print("|---|---|")
          for k, v in sorted(counts.items(), key=lambda kv: -kv[1]):
              print(f"| {k} | {v} |")
          print(f"| **total** | **{len(latest)}** |")
          print("\n#### Not working\n")
          for r in latest.values():
              if r["verdict"] in ("dead", "blocked"):
                  print(f"- `{r['source_id']}` — {r['verdict']}: {r['detail'][:100]}")
          PY

      - name: Open an issue when sources are dead
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          dead=$(python - <<'PY'
          import json, pathlib
          rows = [json.loads(l) for l in pathlib.Path("data/state/health.jsonl").read_text(encoding="utf-8").splitlines() if l.strip()]
          latest = {r["source_id"]: r for r in rows}
          dead = [(k, v["detail"][:120]) for k, v in latest.items() if v["verdict"] == "dead"]
          print(len(dead))
          for k, d in dead:
              print(f"- `{k}` — {d}")
          PY
          )
          count=$(printf '%s\n' "$dead" | head -n1)
          if [ "$count" = "0" ]; then
            echo "no dead sources"
            exit 0
          fi
          title="信息源健康周报：$(date -u +%F) — $count 个源不可达"
          body=$(printf '%s\n' "$dead" | tail -n +2)
          gh issue create --title "$title" --body "$body" --label "source-health" || \
            gh issue create --title "$title" --body "$body"
