name: Slot watchdog

# The third line of defence, and the only one that survives GitHub dropping a trigger.

# **Why the previous version did not work.** It ran three times a day at "10 past" each slot and
# asked "has today published yet, and was the last scheduled run a failure?". Both halves were
# wrong for the failure that actually happens:

#   Measured 2026-10-21. daily.yml is crons at UTC 20:00 / 04:00 / 12:00. Over eight scheduled
#   triggers the observed fire times were 23:10, 17:15, 16:12, 22:50 -- a drift of two to four
#   hours, and two slots produced no run at all. The watchdog itself, crons at 21:10 / 05:10 /
#   13:10, actually fired at 23:50, 17:56, 10:00 and 00:17. GitHub does not honour the minute;
#   under load it delays by hours and the docs say queued jobs may be dropped.

#   So "check ten minutes after the slot" was checking at a time nothing could be relied on.
#   And "was the last scheduled run a failure?" is false for a slot that never ran at all -- at
#   23:50 the last run was the 23:10 success, so the watchdog concluded there was nothing to do
#   while the 12:00 Beijing slot silently never happened. That is exactly what the digest showed:
#   juya published 14 stories at 01:28 UTC that never reached the issue.

# **What it does now.** It no longer reasons about individual triggers. It runs every two hours,
# works out which slots *should* have published by now (Beijing 05:00 / 13:00 / 21:00 -- one hour
# of grace after each), and compares that against what the ledger says was published. A missing
# slot is re-triggered regardless of what the last run reported, because "no run" and "failed run"
# are the same problem from the reader’s side.

# Every two hours rather than three times a day because the drift is hours: a single check at the
# wrong moment proves nothing, and four extra cheap runs a day cost only the seconds it takes to
# read the ledger.

on:
  schedule:
    # UTC. Every two hours, off the hour so it does not contend with the collection itself.
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: slot-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Which slots are missing?
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/missing_slots.py

      - name: Re-trigger the daily workflow
        if: steps.decide.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::${{ steps.decide.outputs.reason }}"
          gh workflow run daily.yml --repo "$GITHUB_REPOSITORY" -f force=false
          echo "::notice::re-triggered daily.yml"
