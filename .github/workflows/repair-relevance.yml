name: Repair relevance

# Re-judge already-published issues with the model and remove what is not AI news.
#
# Fixing the relevance regex stops the *next* issue from repeating a mistake; it does not
# clean the issues already on disk. This is the tool for that, and it is dispatch-only on
# purpose: rewriting published data is a deliberate act, never a scheduled one.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "要修复的期号，空格分隔可给多个"
        required: true
        type: string
      dry_run:
        description: "只报告，不写回"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: repair-relevance
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -e ".[fetchers,llm]"

      - name: Model relevance judgement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_KEYS_JSON: ${{ secrets.RELAY_KEYS_JSON }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/fix_relevance.py ${{ inputs.date }}
          else
            python scripts/fix_relevance.py ${{ inputs.date }} --apply
          fi

      - name: Rebuild site
        if: ${{ inputs.dry_run == false }}
        run: python scripts/rebuild_site.py

      - name: Commit
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "ai-daily"
          git config user.email "ai-daily@local"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore(daily): ${{ inputs.date }} relevance repair"
          for _ in 1 2 3 4 5; do
            git push && break
            sleep 8
            # `A && B || C` hides a real failure: shellcheck SC2015, and it also
            # rebounds even when the fetch failed.
            if git fetch origin main; then
              git rebase origin/main || true
            fi
          done