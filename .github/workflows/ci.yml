name: CI

# Runs on every push and pull request. Nothing here touches the network or a model API:
# the tests mock every transport, so a fork can run them with no secrets configured.
#
# Three of these steps are guards rather than tests, and they exist because the project
# makes promises that are easy to break by accident:
#   * source provenance -- merging must never drop an audited source
#   * secret scanning    -- keys must never reach the repository
#   * PII check          -- no personal email or chat id in a public repo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit, contract and offline integration tests
        run: pytest -q

      - name: Source provenance guard
        # The registry must still cover all 107 audited source locations, and the
        # registry shape must not drift silently.
        run: pytest -q tests/contract/test_source_coverage.py -v

      - name: Registry is reproducible
        # Regenerating from the audit ledger must produce the same source ids; ids are
        # referenced by sources/overrides.yaml and config/daily.yaml. Local additions in
        # sources/local.yaml are appended by the same script, so they must survive a
        # rebuild too -- that is what makes them safe to reference.
        run: |
          cp sources/registry.yaml /tmp/registry.before.yaml
          python scripts/build_registry.py
          python - <<'PY'
          import sys, yaml
          before = yaml.safe_load(open('/tmp/registry.before.yaml', encoding='utf-8'))
          after = yaml.safe_load(open('sources/registry.yaml', encoding='utf-8'))
          a = [s['source_id'] for s in before['sources']]
          b = [s['source_id'] for s in after['sources']]
          if a != b:
              print('source_id drift detected:')
              for x, y in zip(a, b):
                  if x != y:
                      print(f'  {x} -> {y}')
              sys.exit(1)
          print(f'{len(a)} source ids stable')
          PY

      - name: Feeds are consumable
        # The feeds are the n8n hand-off. "It parses" is not the bar: a workflow needs the
        # body, a stable id, a parseable timestamp and plain text for nodes that cannot
        # render HTML. The first version sent a list of URLs as `<description>` while the
        # JSON feed carried the facts, so this asserts the two agree.
        run: python scripts/test_feeds.py

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No secrets in the repository
        run: |
          set -e
          # Design notes, each learned by running the guard under a real shell:
          #
          #  * **POSIX ERE only.** `git grep -E` has no lookaround *and* no non-capturing
          #    groups. Both were tried; both make grep exit 2 with "Invalid preceding
          #    regular expression". A boundary is written as `(^|[^A-Za-z0-9])` and every
          #    group is a plain `(...)`.
          #  * **Exit status must be captured, not branched on.** `if git grep ...; then
          #    fail; fi` reads a syntax error (exit 2) as "no match" and reports the repo
          #    as clean. The first version of this guard did exactly that and never
          #    checked anything.
          #  * **A trailing opaque blob.** Real keys end in 16+ characters with no hyphen;
          #    hyphenated English ("sk-for-teens-after-parental-alerts") does not. That is
          #    what stops a digest from failing the build.
          PATTERNS='(^|[^A-Za-z0-9])(sk-([A-Za-z0-9]{1,12}-){0,3}[A-Za-z0-9]{16,}|gsk_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|cfat_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|nvapi-[A-Za-z0-9_-]{20,})'
          set +e
          found=$(git grep -nIE "$PATTERNS" -- . ':!*.lock')
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::secret guard failed to run (git grep exit $status) -- it checked nothing"
            exit 1
          fi
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::possible credential committed"
            exit 1
          fi
          echo "no credential patterns found"

      - name: No PII in tracked files
        run: |
          set -e
          # A personal address and a Telegram chat id were committed in one of the
          # audited repositories. Here that must fail the build.
          #
          # Placeholders (`xxx@qq.com`, `your_gmail@gmail.com`) are documentation, not a
          # person. The audit report is excluded because it necessarily quotes what it
          # found -- and the address it quotes is already redacted.
          #
          # Note the `git grep ... || true`: a grep syntax error must not read as "no
          # match", which is how the sibling secret guard silently stopped working.
          PATTERNS='[A-Za-z0-9._%+-]+@(qq|gmail|163|outlook)\.com'
          ALLOW='(xxx@|your_|your-|example@|noreply@|user@)'
          found=$(git grep -nIE "$PATTERNS" -- . ':!*.lock' ':!audit/' | grep -vE "$ALLOW" || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::personal email address in a tracked file"
            exit 1
          fi
          echo "no personal addresses found"

      - name: Registry and overrides contain no credentials
        run: |
          set -e
          if grep -nE '(api_key|apikey|token|password|cookie)\s*[:=]\s*["\x27]?[A-Za-z0-9_-]{16,}' \
               sources/registry.yaml sources/overrides.yaml config/daily.yaml; then
            echo "::error::credential-looking value in a config file"
            exit 1
          fi
          echo "config files are clean"

      - name: Workflow shell is sound
        # `$?` after a pipeline is the *last* command's status, and a `run:` block has
        # pipefail off. The daily workflow read `code=$?` after `... | tee publish.log`, so
        # a crash reported success and the gate's "already published" code 10 was
        # unreachable. The only visible symptom was that the site did not update.
        run: bash scripts/workflow_guards.sh

      - name: Generated site is sound
        run: |
          # The site guards live in a script so they can be run before a push too.
          # They exist because a leftover TypeScript annotation in `assets/motion.js` made
          # the browser reject the entire file: search, theme, calendar and the TOC all
          # died silently while the Python suite stayed green.
          #
          # The built copy under `data/digests/site/` is committed, so the freshness and
          # dead-link checks have something to compare against here.
          bash scripts/site_guards.sh

      - name: Every page works with motion disabled
        # The design gate: the reduced-motion version is the page, and the motion is the
        # enhancement. A still frame that does not read as designed means the motion was
        # carrying an undesigned layout.
        #
        # Playwright is installed only here, not in the test matrix, because the browser
        # download dominates CI time and this check needs no Python version coverage.
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/test_site_interactions.py

      - name: Calendars are aligned
        # Both month grids are drawn on the client, so a static parse only sees the weekday
        # header. This measures real rects against the calendar module: the leading blanks
        # must equal the weekday index of the 1st, and every date must land in the column of
        # its own weekday.
        #
        # It exists because the same grid was judged wrong three times in a row -- each time
        # the *measurement* was wrong, not the calendar.
        run: python scripts/test_calendars.py

      - name: Rails resize and stay scrollable
        # Both features are invisible to a static parse and both can "look fine" while doing
        # nothing: a grip renders whether or not its pointer handler fires, and a scrollbar
        # can be styled to *hidden* rather than *quiet*, removing the only cue that the rail
        # scrolls. This drives a real pointer drag and then asserts the rail is still
        # scrollable.
        run: python scripts/test_rails.py
