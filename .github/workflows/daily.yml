name: AI Daily

# Two collections a day, 07:00 and 19:00 Beijing.
#
# The morning run takes what published overnight; the evening run takes the day's releases and
# merges them into the same date's issue, deduplicated against the morning's content. That is why
# the idempotency gate keys on **date + slot** rather than date alone: keyed on the date, the
# evening run was a permanent no-op and the day's afternoon news never arrived.
#
# Two triggers per slot, 17 minutes apart and off the hour, because GitHub's schedule event is
# delayed under load and the docs say queued jobs may be *dropped*. Within a slot the first
# successful publish wins and the retry is a no-op.
#
# The timezone key is used instead of hand-converted UTC so the schedule cannot drift.

on:
  # **UTC, with no `timezone` key.** GitHub Actions runs POSIX cron in UTC and does not document
  # a `timezone` field on a schedule entry; carrying one left the actual fire time impossible to
  # predict from the file. The UTC hour is written directly instead, so the schedule means exactly
  # one thing. 04:00 Beijing = 20:00 UTC the day before; 12:00 = 04:00 UTC; 20:00 = 12:00 UTC.
  #
  # **Six triggers per slot, every 10 minutes.** Measured on 2026-10-21: over 100 runs of this
  # workflow, only 15 were `schedule` (61 were `push`), and the observed fire times were
  # 01:56, 06:50, 07:10, 07:50 Beijing -- everything clustered in the small hours, with the
  # 12:00 and 20:00 slots producing *no run at all*. GitHub delays scheduled events by hours
  # under load and the docs state queued jobs may be dropped; two triggers per slot, 17 minutes
  # apart, assumed the delay was minutes.
  #
  # Six attempts spread over an hour costs nothing when it works -- the gate inside the run
  # makes every attempt after the first a no-op that exits in seconds, because the ledger already
  # records the slot as published. When the trigger is dropped, the next one ten minutes later
  # catches it. This is the only lever that acts on the *trigger* rather than on its consequences.
  #
  # Keep in step with `run.slots` in config/daily.yaml: that list drives the critical-source wait
  # window and the "too early" gate, and a mismatch makes the gate refuse a run the cron started.
  schedule:
    - cron: "0,10,20,30,40,50 20 * * *"   # 04:00–04:50 北京
    - cron: "0,10,20,30,40,50 4 * * *"    # 12:00–12:50 北京
    - cron: "0,10,20,30,40,50 12 * * *"   # 20:00–20:50 北京

  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the run ledger and publish again today"
        type: boolean
        default: false
      skip_collect:
        description: "Reuse the latest collected items artefact instead of re-fetching"
        type: boolean
        default: false

permissions:
  contents: read

# One writer at a time. cancel-in-progress is false on purpose: cancelling a run that has
# already delivered an email cannot un-deliver it, and the ledger would be left partial.
concurrency:
  group: ai-daily
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  AIDAILY_RUN__CRITICAL_WAIT_MINUTES: "8"

jobs:
  # ---------------------------------------------------------------------------
  # 1. The cheapest possible check, first. A trigger that has nothing to do costs
  #    seconds and zero API calls.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      date: ${{ steps.decide.outputs.date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # `[fetchers]` and not plain `-e .`: the gate imports `aidaily.collect`, which imports the
      # HTML roundup splitter. With only the base install this step died on a missing `bs4`
      # before it could decide anything, and because the failure branch only appended a
      # `::error::` the run read as "gate failed" with no reason attached.
      - run: pip install -e ".[fetchers]"
      - name: Decide whether today still needs publishing
        id: decide
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set +e
          if [ "$FORCE" = "true" ]; then
            python -m aidaily gate --force | tee gate.json
            code=0
          else
            python -m aidaily gate | tee gate.json
            # `${PIPESTATUS[0]}`, not `$?`: pipefail is off in a `run:` block, so `$?` is
            # `tee`'s status and is always 0. That made the `10` branch below (already
            # published) and the failure branch both unreachable -- every trigger looked
            # like "go", and a crashing gate looked like "go" too.
            code=${PIPESTATUS[0]}
          fi
          # A gate that crashed wrote nothing, so the `json.load` below would raise
          # `JSONDecodeError` and bury the real cause under a traceback about JSON. Report the
          # exit code and the (empty) output first, then the parse error explains itself.
          if [ ! -s gate.json ]; then
            echo "::error::gate produced no output (exit $code) -- see the traceback above"
            exit "${code:-1}"
          fi
          date=$(python -c "import json;print(json.load(open('gate.json'))['date'])" 2>/dev/null)
          if [ -z "$date" ]; then
            echo "::error::gate output has no 'date' field: $(cat gate.json)"
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          # 0  = go
          # 10 = today is already published, nothing to do
          # 11 = "too early": the target date is not complete yet. `__main__` gives this its own
          #      exit code precisely so it is never confused with a failure, and the publish step
          #      already treats it as a no-op -- but the gate did not, so a scheduled run that
          #      arrived before the collection window turned the whole workflow red. That is the
          #      single most common "failure" on the run list: seven of nine red runs were a
          #      step reporting a correct decision as an error.
          case "$code" in
            0)  echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            10) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            11)
              echo "::notice::too early to build $date (exit 11) -- waiting for the collection window"
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)  echo "::error::gate failed with exit $code"; exit "$code" ;;
          esac
      - name: Report
        run: |
          # One redirect rather than four: shellcheck flags repeated appends to the same
          # file (SC2129), and a single block is easier to read in the summary.
          {
            echo "### Gate"
            echo '```json'
            cat gate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Collect. One job rather than a matrix: the sources are I/O bound and a single
  #    runner already saturates them, while a matrix would duplicate the rate limits.
  # ---------------------------------------------------------------------------
  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[fetchers]"

      - name: Collect all enabled sources
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        # --wait-critical re-checks the sources whose current-day edition is a scheduling
        # risk (juya publishes at 09:48). On timeout the run continues and the digest
        # states which source fell back to yesterday.
        run: |
          python -m aidaily collect \
            --concurrency 10 \
            --wait-critical 8 \
            --show-failures \
            --out data/raw/items.jsonl | tee collect.log

      - name: Run summary
        run: |
          {
            echo "### Collection"
            echo '```'
            tail -n 40 collect.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        # Upload even when the step above failed: a partial collection is still the most
        # useful input for a retry, and re-fetching would produce different data.
        if: always()
        with:
          name: raw-items
          path: |
            data/raw/items.jsonl
            data/state/collect.jsonl
            collect.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Analyse, render and deliver. Reading the artefact means a retry here never
  #    re-fetches, so the digest for a given day is built from one consistent snapshot.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 3. Analyse, render and deliver. Reading the artefact means a retry here never
  #    re-fetches, so the digest for a given day is built from one consistent snapshot.
  # ---------------------------------------------------------------------------
  publish:
    needs: [gate, collect]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # `github_meta` reads this to lift the REST quota from 60/h (anonymous) to 1000/h.
      # Without it, the shared runner IP is usually already rate-limited and every
      # repository fetch returns None -- the cards silently disappear.
      GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[fetchers,llm]"

      # Playwright renders the GitHub repository cards to PNG for the RSS `<enclosure>`.
      #
      # The Python package alone is not enough: the browser binaries are a separate download,
      # and without them `card_png` returns None -- silently, by design, because a missing
      # picture must never fail an issue.
      #
      # **The download is not reliable.** Run 39589942598 failed it with
      # `getaddrinfo ENOTFOUND playwright.download.prss.microsoft.com` -- a DNS failure on the
      # runner, not a version problem. A retry usually works, and the two steps are marked
      # `continue-on-error` because a missing browser costs the card images, not the issue.
      #
      # `--with-deps` pulls the system libraries Chromium needs on a bare ubuntu-latest.
      - name: Install Playwright Chromium
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "attempt $attempt"
            python -m playwright install --with-deps chromium && break
            sleep $((attempt * 10))
          done

      # Report what actually happened instead of assuming. A missing browser is not fatal, but it
      # must be visible in the log rather than inferred from a page with no cards.
      - name: Check Playwright
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          try:
              with sync_playwright() as p:
                  p.chromium.launch().close()
              print("playwright: chromium ready")
          except Exception as exc:
              print(f"playwright: chromium unavailable -- {type(exc).__name__}: {exc}")
              print("playwright: repository cards will fall back to plain headlines")
          PY

      - uses: actions/download-artifact@v8
        if: inputs.skip_collect != true
        with:
          name: raw-items
          path: .

      - name: Publish
        id: publish
        env:
          # Model keys: official tiers first, relays only as a fallback.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          # Tavily 搜索。采集与发布两个 job 都要传：publish 在
          # skip_collect=false 时会自己采集一次。
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_KEYS_JSON: ${{ secrets.RELAY_KEYS_JSON }}
          # Delivery
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          set +e
          # Retry the publish when it fails for a transient reason.
          #
          # The three scheduled slots are the product. A single failure there means no
          # digest for that slot, and the measured record is 10 successes out of 20 scheduled
          # triggers -- half the slots produced nothing. The causes were external: model
          # providers rate-limiting (HTTP 429), relays returning 403, a fetch timing out, the
          # network dropping mid-request. None of those is a reason to lose the day.
          #
          # The decision codes are NOT retried, because repeating them cannot help:
          #   10 already published  11 too early  12 empty selection (a bug, must stay red)
          # Everything else is a runtime failure, and a second attempt routinely succeeds --
          # the provider that was rate-limited a minute ago has moved on.
          attempt=1
          max_attempts=3
          while true; do
            echo "::group::publish attempt $attempt / $max_attempts"
            # The media repository is a *separate* repository, so the workflow GITHUB_TOKEN
            # (scoped to this one) cannot push to it. MEDIA_TOKEN is a fine-grained PAT with
            # Contents: Read and write on siweimidu/ai-daily-media only. When it is absent the
            # image stage stores locally and returns no URLs, so the issue publishes without
            # pictures rather than failing -- decoration must not break the run.
            export MEDIA_TOKEN="${{ secrets.MEDIA_TOKEN }}"
            python -m aidaily run \
              --from-items data/raw/items.jsonl \
              --site-url "$SITE_URL" \
              --analyze-limit 0 | tee "publish.log" | tee "publish-$attempt.log"
            # `${PIPESTATUS[0]}`, not `$?`. GitHub Actions runs a `run:` block as
            # `bash -e {0}` with **pipefail off**, so `$?` after a pipeline is `tee`'s status
            # -- and tee succeeds because it dutifully wrote the output. A crash therefore
            # came back as 0, the job reported success, and the only symptom was that the site
            # did not update: indistinguishable from "nothing to publish today".
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "code=$code" >> "$GITHUB_OUTPUT"
            # 10 = the gate inside `run` decided today was already delivered.
            # 11 = "too early": the target date is not complete yet, so no digest was built.
            #      `__main__` gives this its own exit code precisely so it is never confused
            #      with a failure, but this step once only recognised 10, so a manual trigger
            #      at 00:57 -- before the collection window, when there is genuinely nothing to
            #      build -- turned the whole run red. The code did the right thing; the
            #      workflow called it an error.
            if [ "$code" = "10" ]; then exit 0; fi
            if [ "$code" = "11" ]; then
              echo "::notice::too early to build a digest (exit 11) -- nothing to publish yet"
              exit 0
            fi
            # 12 = the candidate pool was non-empty but selection produced nothing. This is a
            #      bug, not a quiet day, and it must fail the run: on 2026-10-19 an empty
            #      digest shipped with every step green, and the gap was invisible for hours.
            #      Retrying cannot fix it, so it goes straight to red.
            if [ "$code" = "12" ]; then
              echo "::error::empty selection from a non-empty pool (exit 12) -- this is a bug, not a quiet day"
              exit 1
            fi
            if [ "$code" = "0" ]; then
              exit 0
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::publish failed with exit code $code after $max_attempts attempts"
              exit "$code"
            fi
            echo "::warning::publish failed with exit code $code; retrying after a pause"
            attempt=$((attempt + 1))
            sleep $((30 * attempt))
          done

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Publish"
            echo '```'
            tail -n 60 publish.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deduplication is a promise, and until now nothing checked it. Three regressions shipped
      # unnoticed in one week -- Gemini 4 ran four days running, the DeepSeek V4.1 launch was
      # deleted as a "repeat" of an unrelated story, another outlet's digest was republished as
      # news -- and every one was found by the reader. This step runs the audit against the
      # archived issues after publishing, so a regression turns the run red on the day it
      # happens instead of accumulating in the archive.
      - name: Audit deduplication
        if: always()
        run: |
          python -m aidaily.dedup_audit --window 7 | tee dedup-audit.log
          {
            echo "### 去重审计"
            echo '```'
            cat dedup-audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state and digests
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ sources/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(daily): $(TZ=Asia/Shanghai date +%F) digest"
          # Retry on a rejected push. The interesting part is what happens on a conflict.
          #
          # This loop used to call `git rebase` and abort on any conflict, so all five
          # attempts failed the same way and the run went red. That happened twice:
          # 2026-10-15 and 2026-10-16 both died on `CONFLICT (content)` in
          # data/digests/*.json and site/index.html.
          #
          # A conflict here is not a disagreement to be resolved -- it is two runs that both
          # generated the same files. The commit being pushed was produced seconds ago from
          # today's data, so ITS version is the current truth and the remote copy is the older
          # generation. `-X theirs` during rebase says exactly that: on a conflicting hunk,
          # take the commit being replayed rather than the upstream one.
          #
          # Nothing hand-written is ever committed by this job -- only generated output under
          # data/ and sources/ -- so preferring the newest generation cannot discard an edit a
          # human made. That property is what makes this safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/${GITHUB_REF_NAME} (attempt $attempt)"
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              sleep 3
              continue
            fi
            echo "rebase hit a conflict; keeping this run's generated files"
            git rebase --abort 2>/dev/null || true
            if git merge -X ours -m "chore(daily): merge generated output" "origin/${GITHUB_REF_NAME}"; then
              sleep 3
              continue
            fi
            git merge --abort 2>/dev/null || true
            echo "::warning::could not reconcile with origin; retrying"
            sleep 5
          done
          echo "::error::failed to push after 5 attempts"
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: digest
          path: |
            data/digests/
            publish.log
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: data/digests/site

  # ---------------------------------------------------------------------------
  # 4. Deploy the archive to GitHub Pages.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Model leaderboard refresh.
  #
  # **Its own job, not a step in `publish`.** `publish` is gated on
  # `needs.gate.outputs.run == true`, which is false for the second and third slot of a day --
  # the gate exists so a day is published once. The leaderboard is not part of the digest: it
  # is a page fed by an outside service, and it should follow that service, not our publish
  # ledger. On a three-slot day the old arrangement refreshed it before dawn and then showed
  # pre-dawn data until tomorrow.
  #
  # The command itself decides whether to act: it reads the snapshot, and rewrites the page
  # only when the snapshot is older than `--max-age-hours` or the rendered HTML changed. A run
  # that finds nothing to do prints "页面已是最新" and exits 0, which keeps the six redundant
  # cron triggers per slot from churning the repository.
  leaderboard:
    needs: [gate]
    if: always() && needs.gate.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[fetchers]"
      - name: Refresh the leaderboard page
        run: python -m aidaily leaderboard --max-age-hours 6
      - name: Commit if the page changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digests/site/leaderboard.html data/state/leaderboard.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "leaderboard unchanged"
            exit 0
          fi
          git commit -m "chore(leaderboard): $(TZ=Asia/Shanghai date +%F\ %H:%M) refresh"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected; rebasing (attempt $attempt)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort 2>/dev/null || true
              git reset --hard "origin/${GITHUB_REF_NAME}"
              exit 1
            }
            sleep $((attempt * 5))
          done
          exit 1

  deploy:
    # **Only `publish` produces the Pages artifact.**
    #
    # `leaderboard` was in this condition for one commit, to let a refreshed leaderboard
    # deploy even when publish failed. That is wrong: `actions/upload-pages-artifact` runs
    # inside `publish`, so when publish is skipped there is nothing to deploy and
    # `deploy-pages` fails with "No artifacts named github-pages were found".
    #
    # Measured 2026-10-24 08:35: the gate decided today was already published, collect and
    # publish were skipped, `leaderboard` succeeded, and the deploy job failed the whole
    # run. A skipped job must not turn into a red workflow.
    #
    # `leaderboard` stays in `needs` so its commit is on disk before publish packages the
    # artifact, but it can no longer make deploy run on its own.
    needs: [publish, leaderboard]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
