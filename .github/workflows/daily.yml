name: AI Daily

# Two collections a day, 07:00 and 19:00 Beijing.
#
# The morning run takes what published overnight; the evening run takes the day's releases and
# merges them into the same date's issue, deduplicated against the morning's content. That is why
# the idempotency gate keys on **date + slot** rather than date alone: keyed on the date, the
# evening run was a permanent no-op and the day's afternoon news never arrived.
#
# Two triggers per slot, 17 minutes apart and off the hour, because GitHub's schedule event is
# delayed under load and the docs say queued jobs may be *dropped*. Within a slot the first
# successful publish wins and the retry is a no-op.
#
# The timezone key is used instead of hand-converted UTC so the schedule cannot drift.

on:
  # **UTC, with no `timezone` key.** GitHub Actions runs POSIX cron in UTC and does not document
  # a `timezone` field on a schedule entry; carrying one left the actual fire time impossible to
  # predict from the file. The UTC hour is written directly instead, so the schedule means exactly
  # one thing. 07:00 Beijing = 23:00 UTC the day before; 19:00 Beijing = 11:00 UTC.
  #
  # Two triggers per slot, 17 minutes apart and off the hour: GitHub's schedule event is delayed
  # under load and the docs say queued jobs may be *dropped*, so one trigger per slot is not
  # enough. Within a slot the first successful publish wins and the retry is a no-op.
  #
  # **Three slots a day: 04:00 / 12:00 / 20:00 Beijing.** Two was not enough. Measured on the
  # 2026-10-17 issue: its window closed at 06:38 UTC (14:38 Beijing), so anything published in
  # the afternoon -- including DeepSeek V4.1 Flash becoming the day's main story -- could not
  # appear until the next morning, by which time it was no longer news. Three slots, four hours
  # apart at the tightest, means the day's afternoon burst lands in that evening's issue.
  #
  # Keep these in step with `run.slots` in config/daily.yaml: that list drives the
  # critical-source wait window and the "too early" gate, and a mismatch makes the gate refuse
  # a run the cron just started.
  schedule:
    - cron: "0 20 * * *"     # 04:00 北京（前一天 UTC 20:00）
    - cron: "17 20 * * *"    # 04:17 北京（重试）
    - cron: "0 4 * * *"      # 12:00 北京
    - cron: "17 4 * * *"     # 12:17 北京（重试）
    - cron: "0 12 * * *"     # 20:00 北京
    - cron: "17 12 * * *"    # 20:17 北京（重试）
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the run ledger and publish again today"
        type: boolean
        default: false
      skip_collect:
        description: "Reuse the latest collected items artefact instead of re-fetching"
        type: boolean
        default: false

permissions:
  contents: read

# One writer at a time. cancel-in-progress is false on purpose: cancelling a run that has
# already delivered an email cannot un-deliver it, and the ledger would be left partial.
concurrency:
  group: ai-daily
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  AIDAILY_RUN__CRITICAL_WAIT_MINUTES: "20"

jobs:
  # ---------------------------------------------------------------------------
  # 1. The cheapest possible check, first. A trigger that has nothing to do costs
  #    seconds and zero API calls.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      date: ${{ steps.decide.outputs.date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # `[fetchers]` and not plain `-e .`: the gate imports `aidaily.collect`, which imports the
      # HTML roundup splitter. With only the base install this step died on a missing `bs4`
      # before it could decide anything, and because the failure branch only appended a
      # `::error::` the run read as "gate failed" with no reason attached.
      - run: pip install -e ".[fetchers]"
      - name: Decide whether today still needs publishing
        id: decide
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set +e
          if [ "$FORCE" = "true" ]; then
            python -m aidaily gate --force | tee gate.json
            code=0
          else
            python -m aidaily gate | tee gate.json
            # `${PIPESTATUS[0]}`, not `$?`: pipefail is off in a `run:` block, so `$?` is
            # `tee`'s status and is always 0. That made the `10` branch below (already
            # published) and the failure branch both unreachable -- every trigger looked
            # like "go", and a crashing gate looked like "go" too.
            code=${PIPESTATUS[0]}
          fi
          # A gate that crashed wrote nothing, so the `json.load` below would raise
          # `JSONDecodeError` and bury the real cause under a traceback about JSON. Report the
          # exit code and the (empty) output first, then the parse error explains itself.
          if [ ! -s gate.json ]; then
            echo "::error::gate produced no output (exit $code) -- see the traceback above"
            exit "${code:-1}"
          fi
          date=$(python -c "import json;print(json.load(open('gate.json'))['date'])" 2>/dev/null)
          if [ -z "$date" ]; then
            echo "::error::gate output has no 'date' field: $(cat gate.json)"
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          # 0  = go
          # 10 = today is already published, nothing to do
          # 11 = "too early": the target date is not complete yet. `__main__` gives this its own
          #      exit code precisely so it is never confused with a failure, and the publish step
          #      already treats it as a no-op -- but the gate did not, so a scheduled run that
          #      arrived before the collection window turned the whole workflow red. That is the
          #      single most common "failure" on the run list: seven of nine red runs were a
          #      step reporting a correct decision as an error.
          case "$code" in
            0)  echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            10) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            11)
              echo "::notice::too early to build $date (exit 11) -- waiting for the collection window"
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)  echo "::error::gate failed with exit $code"; exit "$code" ;;
          esac
      - name: Report
        run: |
          echo "### Gate" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat gate.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Collect. One job rather than a matrix: 34 live sources finish in under a minute,
  #    so sharding would add moving parts without buying anything. Sharding becomes
  #    worthwhile past roughly 150 sources.
  # ---------------------------------------------------------------------------
  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true' && inputs.skip_collect != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[fetchers]"

      - name: Collect all enabled sources
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        # --wait-critical re-checks the sources whose current-day edition is a scheduling
        # risk (juya publishes at 09:48). On timeout the run continues and the digest
        # states which source fell back to yesterday.
        run: |
          python -m aidaily collect \
            --concurrency 10 \
            --wait-critical 20 \
            --show-failures \
            --out data/raw/items.jsonl | tee collect.log

      - name: Run summary
        run: |
          {
            echo "### Collection"
            echo '```'
            tail -n 40 collect.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        # Upload even when the step above failed: a partial collection is still the most
        # useful input for a retry, and re-fetching would produce different data.
        if: always()
        with:
          name: raw-items
          path: |
            data/raw/items.jsonl
            data/state/collect.jsonl
            collect.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Analyse, render and deliver. Reading the artefact means a retry here never
  #    re-fetches, so the digest for a given day is built from one consistent snapshot.
  # ---------------------------------------------------------------------------
  publish:
    needs: [gate, collect]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[fetchers,llm]"

      - uses: actions/download-artifact@v8
        if: inputs.skip_collect != true
        with:
          name: raw-items
          path: .

      - name: Publish
        id: publish
        env:
          # Model keys: official tiers first, relays only as a fallback.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          # Tavily 搜索。采集与发布两个 job 都要传：publish 在
          # skip_collect=false 时会自己采集一次。
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_KEYS_JSON: ${{ secrets.RELAY_KEYS_JSON }}
          # Delivery
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          set +e
          python -m aidaily run \
            --from-items data/raw/items.jsonl \
            --site-url "$SITE_URL" \
            --analyze-limit 0 | tee publish.log
          # `${PIPESTATUS[0]}`, not `$?`. GitHub Actions runs a `run:` block as
          # `bash -e {0}` with **pipefail off**, so `$?` after a pipeline is `tee`'s status
          # -- and tee succeeds because it dutifully wrote the output. A crash therefore
          # came back as 0, the job reported success, and the only symptom was that the site
          # did not update: indistinguishable from "nothing to publish today".
          #
          # It also silently defeated the gate below: exit 10 read as 0, so an
          # already-published day looked like a normal success.
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 10 = the gate inside `run` decided today was already delivered.
          # 11 = "too early": the target date is not complete yet, so no digest was built.
          #      `__main__` gives this its own exit code precisely so it is never confused
          #      with a failure (see the comment there), but this step only recognised 10, so
          #      a manual trigger at 00:57 -- before the 07:00 collection window, when there
          #      is genuinely nothing to build -- turned the whole run red. The code did the
          #      right thing; the workflow called it an error.
          if [ "$code" = "10" ]; then exit 0; fi
          if [ "$code" = "11" ]; then
            echo "::notice::too early to build a digest (exit 11) -- nothing to publish yet"
            exit 0
          fi
          if [ "$code" != "0" ]; then
            echo "::error::publish failed with exit code $code"
          fi
          exit "$code"

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Publish"
            echo '```'
            tail -n 60 publish.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deduplication is a promise, and until now nothing checked it. Three regressions shipped
      # unnoticed in one week -- Gemini 4 ran four days running, the DeepSeek V4.1 launch was
      # deleted as a "repeat" of an unrelated story, another outlet's digest was republished as
      # news -- and every one was found by the reader. This step runs the audit against the
      # archived issues after publishing, so a regression turns the run red on the day it
      # happens instead of accumulating in the archive.
      - name: Audit deduplication
        if: always()
        run: |
          python -m aidaily.dedup_audit --window 7 | tee dedup-audit.log
          {
            echo "### 去重审计"
            echo '```'
            cat dedup-audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        # Upload even when the step above failed: a partial collection is still the most
        # useful input for a retry, and re-fetching would produce different data.
        if: always()
        with:
          name: raw-items
          path: |
            data/raw/items.jsonl
            data/state/collect.jsonl
            collect.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Analyse, render and deliver. Reading the artefact means a retry here never
  #    re-fetches, so the digest for a given day is built from one consistent snapshot.
  # ---------------------------------------------------------------------------
  publish:
    needs: [gate, collect]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[fetchers,llm]"

      - uses: actions/download-artifact@v8
        if: inputs.skip_collect != true
        with:
          name: raw-items
          path: .

      - name: Publish
        id: publish
        env:
          # Model keys: official tiers first, relays only as a fallback.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          # Tavily 搜索。采集与发布两个 job 都要传：publish 在
          # skip_collect=false 时会自己采集一次。
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_KEYS_JSON: ${{ secrets.RELAY_KEYS_JSON }}
          # Delivery
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          set +e
          python -m aidaily run \
            --from-items data/raw/items.jsonl \
            --site-url "$SITE_URL" \
            --analyze-limit 0 | tee publish.log
          # `${PIPESTATUS[0]}`, not `$?`. GitHub Actions runs a `run:` block as
          # `bash -e {0}` with **pipefail off**, so `$?` after a pipeline is `tee`'s status
          # -- and tee succeeds because it dutifully wrote the output. A crash therefore
          # came back as 0, the job reported success, and the only symptom was that the site
          # did not update: indistinguishable from "nothing to publish today".
          #
          # It also silently defeated the gate below: exit 10 read as 0, so an
          # already-published day looked like a normal success.
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 10 = the gate inside `run` decided today was already delivered.
          # 11 = "too early": the target date is not complete yet, so no digest was built.
          #      `__main__` gives this its own exit code precisely so it is never confused
          #      with a failure (see the comment there), but this step only recognised 10, so
          #      a manual trigger at 00:57 -- before the 07:00 collection window, when there
          #      is genuinely nothing to build -- turned the whole run red. The code did the
          #      right thing; the workflow called it an error.
          if [ "$code" = "10" ]; then exit 0; fi
          if [ "$code" = "11" ]; then
            echo "::notice::too early to build a digest (exit 11) -- nothing to publish yet"
            exit 0
          fi
          if [ "$code" != "0" ]; then
            echo "::error::publish failed with exit code $code"
          fi
          exit "$code"

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Publish"
            echo '```'
            tail -n 60 publish.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deduplication is a promise, and until now nothing checked it. Three regressions shipped
      # unnoticed in one week -- Gemini 4 ran four days running, the DeepSeek V4.1 launch was
      # deleted as a "repeat" of an unrelated story, another outlet's digest was republished as
      # news -- and every one was found by the reader. This step runs the audit against the
      # archived issues after publishing, so a regression turns the run red on the day it
      # happens instead of accumulating in the archive.
      - name: Audit deduplication
        if: always()
        run: |
          python -m aidaily.dedup_audit --window 7 | tee dedup-audit.log
          {
            echo "### 去重审计"
            echo '```'
            cat dedup-audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state and digests
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ sources/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(daily): $(TZ=Asia/Shanghai date +%F) digest"
          # Retry on a rejected push. The interesting part is what happens on a conflict.
          #
          # This loop used to call `git rebase` and abort on any conflict, so all five
          # attempts failed the same way and the run went red. That happened twice:
          # 2026-10-15 and 2026-10-16 both died on `CONFLICT (content)` in
          # data/digests/*.json and site/index.html.
          #
          # A conflict here is not a disagreement to be resolved -- it is two runs that both
          # generated the same files. The commit being pushed was produced seconds ago from
          # today's data, so ITS version is the current truth and the remote copy is the older
          # generation. `-X theirs` during rebase says exactly that: on a conflicting hunk,
          # take the commit being replayed rather than the upstream one.
          #
          # Nothing hand-written is ever committed by this job -- only generated output under
          # data/ and sources/ -- so preferring the newest generation cannot discard an edit a
          # human made. That property is what makes this safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/${GITHUB_REF_NAME} (attempt $attempt)"
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              sleep 3
              continue
            fi
            echo "rebase hit a conflict; keeping this run's generated files"
            git rebase --abort 2>/dev/null || true
            if git merge -X ours -m "chore(daily): merge generated output" "origin/${GITHUB_REF_NAME}"; then
              sleep 3
              continue
            fi
            git merge --abort 2>/dev/null || true
            echo "::warning::could not reconcile with origin; retrying"
            sleep 5
          done
          echo "::error::failed to push after 5 attempts"
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: digest
          path: |
            data/digests/
            publish.log
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: data/digests/site

  # ---------------------------------------------------------------------------
  # 4. Deploy the archive to GitHub Pages.
  # ---------------------------------------------------------------------------
  deploy:
    needs: publish
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
